name: Causal imputation and example tests

on:
  push:
    branches:
      - "feature/causal-upstream-compat"
  pull_request:
    paths:
      - "src/shapiq/causal/**"
      - "src/shapiq/imputer/**"
      - "src/shapiq/explainer/tabular.py"
      - "src/shapiq/__init__.py"
      - "tests/shapiq/tests_unit/test_causal_graphs.py"
      - "tests/shapiq/tests_unit/tests_imputer/**"
      - "examples/applications/causal_bike_sharing/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/causal-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the checkout and example dependencies
        run: |
          uv venv
          uv pip install -e . -r examples/applications/causal_bike_sharing/requirements.txt
      - name: Test causal graph and imputation behavior
        run: |
          uv run --no-sync python -m pytest -q -p no:cacheprovider \
            tests/shapiq/tests_unit/test_causal_graphs.py \
            tests/shapiq/tests_unit/tests_imputer/test_causal_adapters.py \
            tests/shapiq/tests_unit/tests_imputer/test_causal_sampling_invariants.py \
            tests/shapiq/tests_unit/tests_imputer/test_marginal_imputer.py \
            tests/shapiq/tests_unit/tests_imputer/test_marginal_parametric.py \
            tests/shapiq/tests_unit/tests_imputer/test_gaussian_imputer.py \
            tests/shapiq/tests_unit/tests_imputer/test_gaussian_copula_imputer.py \
            tests/shapiq/tests_unit/tests_imputer/test_gaussian_and_copula.py \
            tests/shapiq/tests_unit/tests_imputer/test_gaussian_sampling_invariants.py
      - name: Test the daily bike-sharing example
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider examples/applications/causal_bike_sharing/tests
